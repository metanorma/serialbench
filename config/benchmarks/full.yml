# Configuration for comprehensive benchmarks - Full testing with all data sizes
# Used by Docker script for complete performance analysis

# Run name for identification
name: full-benchmark

data_sizes:
- small
- medium
- large

formats:
- xml
- json
- yaml
- toml

# Trimmed from 20/5/2 (warmup 3): a healthy leg took ~70 minutes at that
# setting, which both inflates weekly cost and leaves legs exposed to
# runner-eviction flakiness. 10/3/1 with warmup 2 halves runtime with
# acceptable added noise.
iterations:
  small: 10
  medium: 3
  large: 1

operations:
- parsing
- generation
- streaming
- xpath
- memory

warmup: 2
