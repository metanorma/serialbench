name: rake

on:
  push:
    branches: [ main ]
    tags: [ v* ]
    paths-ignore:
      - '.github/workflows/windows-debug.yml'
  pull_request:
    paths-ignore:
      - '.github/workflows/windows-debug.yml'

permissions:
  contents: read

jobs:
  rspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - run: bundle exec rspec --format progress
