name: benchmark-weekly

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/windows-debug.yml'
  pull_request:
    paths-ignore:
      - '.github/workflows/windows-debug.yml'
  schedule:
    # Run benchmarks weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Allow manual triggering

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Renamed off "pages": that group's server-side state is wedged (a queued
  # run there returns 500 on cancel and blocks the single in-progress slot),
  # which starved every benchmark-weekly run after 2026-08-23 10:22Z.
  group: "site-deploy"
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ruby-versions: ${{ steps.set-matrix.outputs.ruby-versions }}
      platforms: ${{ steps.set-matrix.outputs.platforms }}
    steps:
      - name: Set matrix configurations
        id: set-matrix
        run: |
          echo 'ruby-versions=["3.2", "3.3", "3.4", "4.0"]' >> $GITHUB_OUTPUT
          echo 'platforms=["ubuntu-24.04", "ubuntu-24.04-arm", "ubuntu-22.04", "ubuntu-22.04-arm", "macos-14", "macos-15", "macos-15-intel", "macos-26", "macos-26-intel", "windows-2022", "windows-2025", "windows-11-arm"]' >> $GITHUB_OUTPUT

  # Cross-platform native benchmarks
  benchmark:
    runs-on: ${{ matrix.platform }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.setup.outputs.platforms) }}
        ruby-version: ${{ fromJson(needs.setup.outputs.ruby-versions) }}
        exclude:
          # RubyInstaller ships no arm64 builds for Ruby 3.2/3.3;
          # windows-11-arm runs 3.4.x and 4.x only
          - platform: windows-11-arm
            ruby-version: "3.2"
          - platform: windows-11-arm
            ruby-version: "3.3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Deep module: one command handles all platform bootstrapping
      # (vcpkg, bundler config, DLL staging, source builds)
      - name: Prepare platform
        run: bundle exec serialbench ci prepare
        shell: bash

      - name: Install system dependencies (Ubuntu)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev build-essential

      - name: Install system dependencies (macOS)
        if: startsWith(matrix.platform, 'macos-')
        run: |
          brew install libxml2 libxslt

      - name: Debug Ruby platform (Windows only)
        if: startsWith(matrix.platform, 'windows-')
        shell: ruby {0}
        run: |
          puts "=== Ruby Platform Debug Info ==="
          puts "RUBY_PLATFORM: #{RUBY_PLATFORM}"
          puts "Gem.win_platform?: #{Gem.win_platform?}"
          puts "RbConfig::CONFIG['host_os']: #{RbConfig::CONFIG['host_os']}"
          puts "RbConfig::CONFIG['host_cpu']: #{RbConfig::CONFIG['host_cpu']}"
          puts "RbConfig::CONFIG['arch']: #{RbConfig::CONFIG['arch']}"
          puts "================================"

      - name: Install gems
        run: bundle install

      # ubuntu-22.04's glibc (2.35) predates the precompiled leptris gem's
      # build host, so the gem's vendored libleptris.so fails to dlopen there
      # and the adapter reports leptris unavailable (empty availability dots
      # on the site). Leptris is pure C99 — build the lib from the gem's
      # tagged source and point the FFI loader at it; LEPTRIS_LIB_PATH is the
      # first candidate in the gem's ffi_lib list.
      - name: Build libleptris from source (Ubuntu 22.04)
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          # Read the version from the gemspec: leptris >= 1.9 ruby-platform fallback
          # gems raise at require time when no library is found, and on 22.04
          # the precompiled variant does not install at all.
          LEPTRIS_VERSION=$(bundle exec ruby -e "print Gem::Specification.find_by_name('leptris').version")
          # RubyGems and the git tags occasionally drift (the 1.9.1 gem
          # shipped with no v1.9.1 tag); build from the highest tag that
          # does not exceed the gem version.
          LEPTRIS_TAG=$(curl -s "https://api.github.com/repos/leptris/leptris/tags?per_page=100" \
            | grep -oE '"v[0-9]+\.[0-9]+\.[0-9]+"' | tr -d '"' | sort -V \
            | awk -v v="v${LEPTRIS_VERSION}" '$0 <= v' | tail -1)
          echo "Building libleptris ${LEPTRIS_VERSION} from tag ${LEPTRIS_TAG}"
          test -n "${LEPTRIS_TAG}"
          curl -sL "https://github.com/leptris/leptris/archive/refs/tags/${LEPTRIS_TAG}.tar.gz" | tar xz
          ln -s "leptris-${LEPTRIS_TAG#v}" "leptris-${LEPTRIS_VERSION}"
          cmake -S "leptris-${LEPTRIS_VERSION}" -B /tmp/leptris-build \
            -DLEPTRIS_BUILD_SHARED=ON -DLEPTRIS_BUILD_STATIC=OFF -DBUILD_TESTING=OFF \
            -DLEPTRIS_BUILD_CLI=OFF -DLEPTRIS_BUILD_BENCHMARKS=OFF -DLEPTRIS_BUILD_MAN_PAGES=OFF \
            -DLEPTRIS_ENABLE_UTF8PROC=OFF -DLEPTRIS_ENABLE_ICONV=OFF
          cmake --build /tmp/leptris-build -j"$(nproc)"
          LIBLEPTRIS=$(find /tmp/leptris-build -name 'libleptris.so*' -type f | head -1)
          echo "Built ${LIBLEPTRIS}"
          echo "LEPTRIS_LIB_PATH=${LIBLEPTRIS}" >> "$GITHUB_ENV"
        shell: bash

      - name: Update Ruby-Build cache
        run: bundle exec serialbench ruby-build update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create environment config
        run: |
          mkdir -p config/environments
          cat > config/environments/ci-ruby-${{ matrix.ruby-version }}.yml << EOF
          ---
          name: ci-ruby-${{ matrix.ruby-version }}-${{ matrix.platform }}
          kind: local
          created_at: '$(date -u +"%Y-%m-%dT%H:%M:%SZ")'
          ruby_build_tag: "${{ matrix.ruby-version }}"
          description: CI environment for Ruby ${{ matrix.ruby-version }} on ${{ matrix.platform }}
          EOF
        shell: bash

      # Each format is an independent checkpoint: benchmark, verify, upload.
      # A failure in one format (OOM, crash) doesn't prevent the others from
      # running and uploading — partial results still reach the deploy.
      - name: Benchmark xml
        continue-on-error: true
        env:
          GITHUB_RUNNER_PLATFORM: ${{ matrix.platform }}
        run: .github/scripts/benchmark-one-format.sh xml ${{ matrix.ruby-version }} ${{ matrix.platform }}

      - name: Upload xml results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.platform }}-ruby-${{ matrix.ruby-version }}-xml
          path: results/runs/ci-ruby-${{ matrix.ruby-version }}-${{ matrix.platform }}/xml
          retention-days: 30
          if-no-files-found: warn

      - name: Benchmark json
        continue-on-error: true
        env:
          GITHUB_RUNNER_PLATFORM: ${{ matrix.platform }}
        run: .github/scripts/benchmark-one-format.sh json ${{ matrix.ruby-version }} ${{ matrix.platform }}

      - name: Upload json results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.platform }}-ruby-${{ matrix.ruby-version }}-json
          path: results/runs/ci-ruby-${{ matrix.ruby-version }}-${{ matrix.platform }}/json
          retention-days: 30
          if-no-files-found: warn

      - name: Benchmark yaml
        continue-on-error: true
        env:
          GITHUB_RUNNER_PLATFORM: ${{ matrix.platform }}
        run: .github/scripts/benchmark-one-format.sh yaml ${{ matrix.ruby-version }} ${{ matrix.platform }}

      - name: Upload yaml results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.platform }}-ruby-${{ matrix.ruby-version }}-yaml
          path: results/runs/ci-ruby-${{ matrix.ruby-version }}-${{ matrix.platform }}/yaml
          retention-days: 30
          if-no-files-found: warn

      - name: Benchmark toml
        continue-on-error: true
        env:
          GITHUB_RUNNER_PLATFORM: ${{ matrix.platform }}
        run: .github/scripts/benchmark-one-format.sh toml ${{ matrix.ruby-version }} ${{ matrix.platform }}

      - name: Upload toml results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.platform }}-ruby-${{ matrix.ruby-version }}-toml
          path: results/runs/ci-ruby-${{ matrix.ruby-version }}-${{ matrix.platform }}/toml
          retention-days: 30
          if-no-files-found: warn

  # Aggregate results and deploy to GitHub Pages
  deploy-pages:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [setup, benchmark]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository (latest main, for accumulated resultset)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev build-essential

      - name: Install gems
        run: bundle install

      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-*
          path: artifacts/

      - name: List downloaded artifacts structure
        run: |
          echo "=== Artifacts directory structure ==="
          ls -la artifacts/
          echo ""
          echo "=== Searching for results.yaml files ==="
          find artifacts/ -name "results.yaml" -type f
          echo ""
          echo "=== Directory tree (first 3 levels) ==="
          find artifacts/ -maxdepth 3 -type d | sort

      # The resultset persists across runs: committed to the repo after each
      # deploy, loaded at the start of the next. add-result merges new data
      # into the accumulated set — evicted legs keep last week's numbers.
      - name: Load or create the accumulated resultset
        run: |
          mkdir -p results/sets
          if [ -f results/sets/weekly-benchmark/resultset.yaml ]; then
            echo "Loading accumulated resultset from repo"
          else
            echo "Creating fresh resultset"
            bundle exec serialbench resultset create weekly-benchmark results/sets/weekly-benchmark
          fi

      - name: Add all results to resultset
        run: |
          bundle exec serialbench resultset add-result results/sets/weekly-benchmark artifacts/benchmark-results-*/

      - name: Export dashboard payload and raw data
        run: |
          bundle exec serialbench resultset export-data results/sets/weekly-benchmark site/src/data/sample.json --raw-data-dir site/public/data

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        run: |
          cd site
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Persist the resultset so the next run builds on this one's data.
      # Uses [skip ci] to avoid triggering another benchmark run.
      - name: Persist resultset for next run
        run: |
          git config user.name "serialbench-bot"
          git config user.email "serialbench-bot@users.noreply.github.com"
          git add results/sets/weekly-benchmark/
          if git diff --staged --quiet; then
            echo "No new results to persist"
          else
            git commit -m "benchmark: accumulate resultset [skip ci]"
            git push origin HEAD:main --force-with-lease
            echo "Persisted resultset to main"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Smoke test: verify the live site is actually serving. Catches
      # integration failures (wrong build path, missing data, broken links)
      # in CI instead of relying on a human visiting the URL.
      - name: Smoke test the deployed site
        run: |
          sleep 10  # allow CDN propagation
          BASE_URL="https://serialbench.github.io/serialbench"
          fail=0

          echo "=== Smoke test: $BASE_URL ==="

          # Index page must serve and contain expected markers
          INDEX=$(curl -sf "$BASE_URL/" || echo "")
          for marker in "Serialbench" "small" "medium"; do
            if ! echo "$INDEX" | grep -q "$marker"; then
              echo "FAIL: index.html missing marker '$marker'"
              fail=1
            fi
          done

          # Data payload must download
          PAYLOAD_CODE=$(curl -sf -o /dev/null -w "%{http_code}" "$BASE_URL/data/resultset.yaml" || echo "000")
          if [ "$PAYLOAD_CODE" != "200" ]; then
            echo "FAIL: data/resultset.yaml returned HTTP $PAYLOAD_CODE"
            fail=1
          fi

          # At least one library page must serve
          LIB_CODE=$(curl -sf -o /dev/null -w "%{http_code}" "$BASE_URL/library/leptris/" || echo "000")
          if [ "$LIB_CODE" != "200" ]; then
            echo "FAIL: library/leptris/ returned HTTP $LIB_CODE"
            fail=1
          fi

          if [ "$fail" = "1" ]; then
            echo "=== SMOKE TEST FAILED ==="
            exit 1
          fi
          echo "=== SMOKE TEST PASSED ==="

  # Summary job
  summary:
    runs-on: ubuntu-latest
    needs: [setup, benchmark, deploy-pages]
    if: always()
    steps:
      - name: Generate workflow summary
        run: |
          echo "## Weekly Benchmark Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Benchmark Status**: ${{ needs.benchmark.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy Status**: ${{ needs.deploy-pages.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platforms Tested" >> $GITHUB_STEP_SUMMARY
          echo "- Ubuntu Latest (Linux x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "- Ubuntu 24.04 (Linux ARM64)" >> $GITHUB_STEP_SUMMARY
          echo "- Ubuntu 22.04 (Linux ARM64)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS 14 (Apple Silicon ARM64)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS 15 (Apple Silicon ARM64)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS 15 Intel (Intel x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS 26 (Apple Silicon ARM64)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS 26 Intel (Intel x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Ruby Versions" >> $GITHUB_STEP_SUMMARY
          echo "- Ruby 3.2, 3.3, 3.4, 4.0" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Serialization Libraries" >> $GITHUB_STEP_SUMMARY
          echo "- **XML**: REXML, Ox, Nokogiri, Oga, LibXML, Leptris" >> $GITHUB_STEP_SUMMARY
          echo "- **JSON**: JSON, Oj, RapidJSON, YAJL" >> $GITHUB_STEP_SUMMARY
          echo "- **YAML**: Psych" >> $GITHUB_STEP_SUMMARY
          echo "- **TOML**: TOML-RB, Tomlib, tomlrb" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "### Results" >> $GITHUB_STEP_SUMMARY
            echo "📊 [View Interactive Dashboard](https://serialbench.github.io/serialbench/)" >> $GITHUB_STEP_SUMMARY
          fi
